# Rogue Legacy 2 - Archipelago player YAML
# ─────────────────────────────────────────
# Fill in your desired slot name below, then drop this file into the Archipelago
# "Players" folder and generate a game via the Archipelago Launcher.

name: SirLee   # must match what you type in the in-game connection window under "Slot Name".

game: Rogue Legacy 2

description: Solo test game for RL2Archipelago development

Rogue Legacy 2:

  # ── Standard Archipelago options ────────────────────────────────────────

  # How strictly the generator ensures all locations are reachable.
  #   full      - every check is always reachable
  #   items     - all relevant items are guaranteed reachable
  #   minimal   - the seed is completable
  accessibility: full

  # Spreads progression items earlier to reduce early-game blocking.
  # 0 = off, 50 = default gentle balancing, 99 = maximum front-loading.
  progression_balancing: 50

  # ── Death Link ──────────────────────────────────────────────────────────

  # When you die, everyone dies - and when anyone else dies, so do you.
  # Dying in Rogue Legacy 2 sends a death event to every other player in the
  # multiworld who also has death_link enabled, killing their current heir.
  # true / false  (default: false)
  death_link: false

  # ── Starting Class ──────────────────────────────────────────────────────

  # When enabled, a random class is chosen as your starting class instead of
  # always starting as the Knight. The chosen class is pre-unlocked at run
  # start and removed from the item pool. If the starting class is not Knight,
  # the Knight class becomes a randomizable multiworld item that must be found
  # before Knight heirs can appear.
  # true / false  (default: true)
  randomize_starting_class: true

  # ── Blueprint Checks ────────────────────────────────────────────────────

  # Number of Archipelago location checks available from blueprint chest
  # drops per biome. Each biome's pool can award at most this many checks;
  # once exhausted, further chest openings drop gold regardless of the AP
  # chance settings below.
  #
  # There are 6 biomes, so the total blueprint check count is this value × 6.
  # The default of 11 gives 66 checks, closely mirroring the 65 unique
  # blueprints in the base game.
  # Valid range: 0–16  (default: 11)
  blueprint_checks_per_biome: 11

  # Percent chance that opening a bronze chest triggers an AP location check
  # (when the biome's pool still has locations remaining). At 100, every bronze
  # chest opening in will drop an AP item. At 1, bronze chests will drop gold
  # 99% of the time. 
  # Valid range: 1–100  (default: 15)
  bronze_chest_ap_chance: 15

  # Percent chance that opening a silver chest triggers an AP location check.
  # Behaves identically to bronze_chest_ap_chance but applies to silver chests,
  # which are rarer and have a higher vanilla blueprint rate.
  # Valid range: 1–100  (default: 99)
  silver_chest_ap_chance: 99

  # ── Rune / Fairy Chest Checks ───────────────────────────────────────────

  # Number of Archipelago location checks available from fairy chests per
  # biome. Once a biome's pool is exhausted, further fairy chest openings drop
  # red aether regardless of the AP chance setting below.
  #
  # There are 6 biomes, so the total fairy chest check count is this value × 6.
  # The default of 4 gives 24 checks, matching the typical rune drop count.
  # Valid range: 0–16  (default: 4)
  rune_checks_per_biome: 4

  # Percent chance that opening a fairy chest triggers an AP location check
  # (when the biome's rune pool still has locations remaining). At 100, every
  # fairy chest opening in a tracked biome consumes a pool slot. At 1, fairy
  # chests always drop red aether 99% of the time.
  # Valid range: 1–100  (default: 100)
  fairy_chest_ap_chance: 100

  # ── Manor Upgrade Bundle Size ────────────────────────────────────────────

  # How many skill-tree levels are granted each time a manor upgrade item is
  # received from the server. Multi-level skills (e.g. Strength Up) are split
  # into multiple AP items whose copies each grant this many levels at once.
  #
  # Example with the default of 5: receiving "Manor: Strength Up I" instantly
  # grants 5 strength levels rather than the 1 level a normal manor purchase
  # gives. The final bundle may grant fewer levels if the skill is near its cap.
  #
  # Set to 1 to mirror the base-game's one-level-at-a-time behavior.
  # Valid range: 1–35  (default: 5)
  manor_upgrade_bundle_size: 5

  # ── Journal & Memory Checks ──────────────────────────────────────────────

  # Controls whether reading journals and memory fragments awards AP checks.
  #
  #   disabled   - no journal or memory checks (0 extra locations).
  #   individual - every journal entry and every memory fragment is its own
  #                check (41 total checks across both categories).
  #   grouped    - one check per biome when ALL journals in that biome are
  #                read, and one check per biome when ALL memories in that
  #                biome are read (8 total checks).
  # Valid values: disabled, individual, grouped  (default: grouped)
  journal_checks: grouped

  # ── Traps ────────────────────────────────────────────────────────────────

  # Total number of NG+ burden trap items placed in the item pool.
  #
  # Traps are harmful items that activate a biome hazard for your current heir
  # when received from the multiworld. The hazard persists until the heir dies.
  # The five trap types are:
  #   - Cannonball Rain   (Burden of Mundi's Flagship)
  #   - Dragon Lancers    (Burden of Irad's Torment)
  #   - Automaton Swarm   (Burden of Pishon's Uprising)
  #   - Giant Snowflakes  (Burden of Kerguelen's Frost)
  #   - Void Waves        (Burden of the High Scholar's Metamorphosis)
  #
  # Items are distributed as evenly as possible across the five types.
  # Set to 0 to disable traps entirely.
  # Valid range: 0–25  (default: 3)
  trap_count: 3

  # ── Manor Upgrade Costs ──────────────────────────────────────────────────

  # Base gold multiplier for manor upgrade costs.
  #
  # Cost formula: base * depth * random_factor, rounded to the nearest 25 gold.
  # 'depth' is a per-slot value that reflects how deep in the manor unlock tree
  # that slot sits. The random_factor is drawn from the range defined by
  # ManorCostMinSubtractFactor and ManorCostMaxAdditiveFactor below.
  # Valid range: 1–9999  (default: 100)
  manor_cost_base: 100

  # Maximum downward variance for manor costs, as a percentage (0–100).
  #
  # E.g. 20 means costs can be as low as (1 - 0.20) = 80% of the base formula.
  # Combined with manor_cost_max_additive_factor, the random factor is drawn
  # uniformly from [1 - subtract/100, 1 + add/100].
  # Set both variance options to 0 for deterministic costs.
  # Valid range: 0–100  (default: 20)
  manor_cost_min_subtractive_factor: 20

  # Maximum upward variance for manor costs, as a percentage (0–500).
  #
  # E.g. 120 means costs can be as high as (1 + 1.20) = 220% of the base formula.
  # Combined with manor_cost_min_subtract_factor, the random factor is drawn
  # uniformly from [1 - subtract/100, 1 + add/100].
  # Set both variance options to 0 for deterministic costs.
  # Valid range: 0–500  (default: 50)
  manor_cost_max_additive_factor: 50

  # ── Progression Gating ───────────────────────────────────────────────────
  # These options tune logical gating and progression through bosses and
  # biomes. 
  # Warning: Adjusting these options can cause generation errors if requirements
  # become too tight - adjust with care.

  # Number of manor depth tiers unlocked per boss killed.
  #
  # Each manor upgrade has a 'depth' reflecting how many prerequisite upgrades
  # it has in the tree. The first x depth tiers are always in logic; each boss
  # cleared opens the next x tiers.
  # With the default of 3: depths 1–3 are available from the start,
  # depths 4–6 require 1 boss, depths 7–9 require 2, and so on.
  # Set to 0 to disable this gating entirely.
  # Valid range: 0–11  (default: 3)
  manor_depths_per_boss: 3

  # Percentage of each biome's chests considered in logic before the biome boss is killed.
  #
  # This reduces the likelihood of needing to clear every chest in a biome just
  # to unlock the items required to beat its boss. This percentage of blueprint
  # chest and fairy chest locations are considered in-logic pre-boss; the rest
  # only become in-logic after the boss is defeated.
  # Valid range: 50–100  (default: 75)
  chest_pre_boss_percent: 75

  # Number of received stat upgrade items logically required per boss.
  #
  # Each subsequent boss requires an additional multiple of this value.
  # With the default of 5: Estuary Lamech requires 5 upgrades, Byarrrith and
  # Halpharr require 10, Estuary Naamah requires 15, Estuary Enoch requires 20,
  # Estuary Irad requires 25, and Estuary Tubal requires 30. Gongheads and Murmur
  # minibosses share Naamah's threshold; Pishon Dry Lake minibosses share Irad's.
  # Set to 0 to disable stat-upgrade gating for bosses.
  # Valid range: 0–10  (default: 5)
  stat_upgrades_per_boss: 5

  # Base number of received stat upgrade items logically required per biome tier.
  #
  # The latter four biomes each require progressively more upgrades before their
  # chest and journal/memory locations are in logic: Kerguelen Plateau requires x,
  # Stygian Study requires 2x, Sun Tower requires 3x, Pishon Dry Lake requires 4x.
  # Citadel Agartha and Axis Mundi are never gated by this setting.
  # Set to 0 to disable stat-upgrade gating for biomes.
  # Valid range: 0–10  (default: 5)
  stat_upgrades_per_biome_tier: 5

  # Whether to push the three NPC unlock items (Living Safe, Blacksmith,
  # Enchantress) earlier in the run so they aren't gated too deep.
  #
  # When enabled, soft rules nudge these unlock locations toward early checks.
  # true / false  (default: true)
  early_npc_unlocks: true
